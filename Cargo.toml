[package]
name = "eggdone_todo"
version = "1.0.1"
edition = "2021"
description = "极简桌面悬浮待办与专注森林"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "wgpu", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
notify-rust = "4.11"
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
